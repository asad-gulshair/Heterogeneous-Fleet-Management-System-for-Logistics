<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TusCore Fleet Console</title>
<style>
:root{
  --bg:#070f24; --navy:#0A1A3C; --s1:#0c1f47; --s2:#112a5c; --line:#1b3569; --line2:#234283;
  --cyan:#2E9FE8; --cyan2:#6cc4ff; --text:#e6eefc; --muted:#8fa4c9; --dim:#5d739c;
  --ok:#3ddc97; --warn:#f5a524; --bad:#ff5d6c;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 70% -10%,#10285a 0%,var(--bg) 60%);color:var(--text);
  font:13px/1.45 Inter,"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh}
.mono{font-family:ui-monospace,Consolas,monospace}
/* top bar */
header{flex:none;display:flex;align-items:center;gap:18px;padding:0 20px;height:56px;border-bottom:1px solid var(--line);background:rgba(10,26,60,.85);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:28px;height:28px}
.brand b{font-size:18px;letter-spacing:.3px;font-weight:800}.brand b i{font-style:normal;color:var(--cyan)}
.brand small{color:var(--muted);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;padding-left:10px;border-left:1px solid var(--line2)}
.site{color:var(--muted)}.site b{color:var(--text);font-weight:600}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:7px;padding:4px 10px;border:1px solid var(--line2);border-radius:99px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.pill .d{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.pill.live{color:var(--ok);border-color:#1d6b4d}.pill.live .d{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.clock{font-variant-numeric:tabular-nums;font-size:15px;font-weight:600}
.clock{line-height:1.15}.clock small{display:block;color:var(--dim);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:500;text-align:right}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:var(--muted);border:0;padding:6px 12px;font-weight:600;font-size:12px;font-family:inherit;cursor:pointer;border-right:1px solid var(--line2)}
.seg button:last-child{border:0}.seg button.on{background:var(--cyan);color:#041225}
.seg button:hover:not(.on){color:var(--text);background:var(--s2)}
/* layout */
.page{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;padding:14px 20px;align-items:start}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.kpi{background:linear-gradient(180deg,var(--s1),#0a1b40);border:1px solid var(--line);border-radius:10px;padding:12px 14px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--cyan))}
.kpi label{display:block;color:var(--muted);font-size:11px;letter-spacing:1.2px;text-transform:uppercase}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.kpi .sub{color:var(--dim);font-size:11px}
.card{background:linear-gradient(180deg,var(--s1),#0a1b40);border:1px solid var(--line);border-radius:10px}
.card>.hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.card>.hd h2{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--cyan2);font-weight:700}
.card>.hd .hint{color:var(--dim);font-size:11px}
.btn{background:transparent;color:var(--cyan2);border:1px solid var(--line2);border-radius:7px;padding:5px 10px;font-weight:600;font-size:12px;font-family:inherit;cursor:pointer}
.btn:hover{background:var(--s2);border-color:var(--cyan)}
#mapwrap{position:relative;padding:10px}
canvas{display:block;margin:0 auto;border-radius:6px;cursor:crosshair}
#tip{position:absolute;pointer-events:none;background:#06122d;border:1px solid var(--line2);border-radius:6px;padding:6px 9px;font-size:12px;display:none;z-index:5;white-space:nowrap}
.legend{position:absolute;left:22px;bottom:22px;display:flex;gap:14px;background:rgba(6,18,45,.82);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:50%}
/* side */
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:11px 0;font-weight:600;font-size:12px;font-family:inherit;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-color:var(--cyan)}
.panel{padding:12px;max-height:calc(100vh - 290px);min-height:420px;overflow:auto}
.rob{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.rob:hover{background:var(--s2)}.rob.sel{background:var(--s2);border-color:var(--cyan)}
.rob .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
.rob .nm{font-weight:600;font-size:12.5px}.rob .meta{color:var(--dim);font-size:11px}
.rob .r{margin-left:auto;text-align:right;min-width:70px}
.chip{display:inline-block;padding:1px 7px;border-radius:99px;font-size:10px;letter-spacing:.8px;text-transform:uppercase;font-weight:700}
.chip.idle{background:#16315f;color:var(--muted)}.chip.moving{background:#0f4a6e;color:var(--cyan2)}
.chip.charging{background:#14503a;color:var(--ok)}.chip.fault{background:#5a1c27;color:var(--bad)}
.bat{height:4px;background:#091630;border-radius:3px;margin-top:5px;overflow:hidden}.bat i{display:block;height:100%}
.grp{color:var(--dim);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;margin:12px 4px 4px}
.detail{background:#08183a;border:1px solid var(--line2);border-radius:9px;padding:12px;margin-bottom:10px}
.detail h3{font-size:15px;display:flex;align-items:center;gap:8px}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border:0}
.kv b{color:var(--muted);font-weight:500}
.vend{padding:12px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px;background:#08183a}
.vend .top{display:flex;align-items:center;gap:10px}.vend .top b{font-size:13.5px}
.on-dot{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--ok);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.on-dot i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok)}
.empty{text-align:center;color:var(--muted);padding:44px 16px}
.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:6px}
.badge{font-size:10px;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--cyan2);letter-spacing:.8px}
footer{display:flex;justify-content:space-between;padding:10px 20px;color:var(--dim);font-size:11px;border-top:1px solid var(--line)}
footer b{color:var(--cyan2);font-weight:600}
.chip.working{background:#5a4310;color:#f5c76a}.chip.waiting{background:#3f2a63;color:#c9a7ff}
.chip.to_charge{background:#14503a;color:var(--ok)}.chip.queued{background:#16315f;color:var(--muted)}
.chip.in_progress{background:#0f4a6e;color:var(--cyan2)}.chip.done{background:#14503a;color:var(--ok)}
.sublabel{color:var(--dim);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase}
.tsum{display:flex;gap:8px;margin-bottom:10px}.tsum div{flex:1;background:#08183a;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.tsum b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.tsum span{color:var(--muted);font-size:10.5px;letter-spacing:1px;text-transform:uppercase}
.oform{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#08183a;border:1px solid var(--line2);border-radius:9px;padding:10px;margin-bottom:12px}
.oform select,.oform input{background:#06122d;color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:7px 8px;font:inherit;width:100%}
.oform .full{grid-column:1/-1}.oform button{background:var(--cyan);color:#041225;border:0;border-radius:7px;padding:8px;font-weight:700;cursor:pointer}
.oform button:hover{background:var(--cyan2)}
.oform label{display:block;color:var(--dim);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.trow{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid var(--line)}
.trow .kd{width:8px;align-self:stretch;border-radius:4px;flex:none}
@media(max-width:1100px){.page{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.panel{max-height:none}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#0f2c63"/><path d="M7 9h18v4h-7v11h-4V13H7z" fill="#2E9FE8"/><circle cx="24" cy="23" r="2.6" fill="#6cc4ff"/></svg>
    <b>Tus<i>Core</i></b><small>Fleet Console</small>
  </div>
  <div class="site" id="site">—</div>
  <div class="spacer"></div>
  <span class="sublabel">Allocator</span><div class="seg" id="alloc"><button data-a="greedy">Greedy</button><button data-a="hungarian">Hungarian</button></div>
  <div class="clock mono"><small id="shiftlbl">Sim time</small><span id="clock">00:00:00</span></div>
  <div class="seg" id="speed"><button data-s="1">1×</button><button data-s="10">10×</button><button data-s="60">60×</button><button data-s="300">300×</button></div>
  <div class="pill" id="live"><span class="d"></span><span id="livetxt">Connecting</span></div>
</header>

<div class="page">
  <div class="kpis">
    <div class="kpi"><label>Orders completed</label><div class="v" id="k_done">0<small>/ 0</small></div><div class="sub" id="k_donesub">0 queued · 0 active</div></div>
    <div class="kpi" style="--c:var(--ok)"><label>Throughput</label><div class="v" id="k_oph">0<small>orders/h</small></div><div class="sub" id="k_ophsub">&nbsp;</div></div>
    <div class="kpi" style="--c:var(--warn)"><label>Avg wait</label><div class="v" id="k_wait">0<small>s</small></div><div class="sub" id="k_waitsub">avg cycle —</div></div>
    <div class="kpi" style="--c:#a78bfa"><label>Utilization</label><div class="v" id="k_util">0<small>%</small></div><div class="sub" id="k_utilsub">robots busy</div></div>
    <div class="kpi" style="--c:#38bdf8"><label>Energy used</label><div class="v" id="k_en">0<small>kWh</small></div><div class="sub" id="k_ensub">0 stock mismatches found</div></div>
  </div>

  <div class="card">
    <div class="hd"><h2>Fleet map</h2><span class="hint" id="hint">Click a robot to inspect it · click the floor to send an idle robot</span><span class="spacer"></span>
      <button class="btn" id="autoBtn">Auto orders: ON</button><button class="btn" id="resetBtn">Reset shift</button></div>
    <div id="mapwrap"><canvas id="map"></canvas><div id="tip"></div><div class="legend" id="legend"></div></div>
  </div>

  <div class="card" style="overflow:hidden">
    <div class="tabs" id="tabs"><button data-t="robots" class="on">Robots</button><button data-t="tasks">Tasks</button><button data-t="vendors">Vendors</button></div>
    <div class="panel" id="panel"></div>
  </div>
</div>
<footer><span>TusCore Fleet Console · v0.1</span><span>Powered by <b>Tusmec</b></span></footer>

<script>
let MAP=null,SNAP=null,sel=null,hover=null,tab='robots',cell=16,dpr=1;
const disp={};                       // smoothed display positions
const $=id=>document.getElementById(id);
const cv=$('map'),ctx=cv.getContext('2d');
let floor=document.createElement('canvas');

const GLYPH={ // small icon per robot type (used in lists)
  tote_amr:'<svg width="16" height="16" viewBox="0 0 16 16"><rect x="3" y="5" width="10" height="7" rx="1.5" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M3 8h10" stroke="#fff"/></svg>',
  scissor_lift:'<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 13h10M4 11l8-5M12 11L4 6M3 4h10" stroke="#fff" stroke-width="1.4" fill="none"/></svg>',
  pallet_stacker:'<svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 12h12M4 12V6h5v6M11 12V9" stroke="#fff" stroke-width="1.5" fill="none"/></svg>',
  drone:'<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2" fill="#fff"/><path d="M3 3l3 3M13 3l-3 3M3 13l3-3M13 13l-3-3" stroke="#fff" stroke-width="1.4"/></svg>'
};
const stateColor=s=>({idle:'#8fa4c9',moving:'#6cc4ff',charging:'#3ddc97',fault:'#ff5d6c'}[s]);
const batColor=b=>b>40?'#3ddc97':b>20?'#f5a524':'#ff5d6c';
const fmtT=t=>{t=Math.floor(t);const h=String(Math.floor(t/3600)).padStart(2,'0'),m=String(Math.floor(t%3600/60)).padStart(2,'0'),s=String(t%60).padStart(2,'0');return`${h}:${m}:${s}`};

async function init(){
  MAP=await (await fetch('/api/map')).json();
  $('site').innerHTML='Site · <b>'+MAP.name+'</b> · '+MAP.width+'×'+MAP.height+' cells';
  $('legend').innerHTML=Object.values(MAP.types).map(t=>`<span><i style="background:${t.color}"></i>${t.label}</span>`).join('');
  resize(); window.addEventListener('resize',resize); connect(); renderPanel(); requestAnimationFrame(frame);
}
function connect(){
  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen=()=>{$('live').classList.add('live');$('livetxt').textContent='Live'};
  ws.onclose=()=>{$('live').classList.remove('live');$('livetxt').textContent='Reconnecting';setTimeout(connect,1000)};
  ws.onmessage=e=>{SNAP=JSON.parse(e.data);onSnap()};
}

/* ---------- static floor layer (drawn once per resize) ---------- */
function resize(){
  const w=$('mapwrap').clientWidth-20; dpr=window.devicePixelRatio||1;
  cell=Math.min(w/MAP.width,Math.max(11,(window.innerHeight-250)/MAP.height)); const w2=cell*MAP.width,h=cell*MAP.height;
  for(const c of [cv,floor]){c.width=Math.round(w2*dpr);c.height=Math.round(h*dpr)}
  cv.style.width=w2+'px';cv.style.height=h+'px';
  drawFloor();
}
function rr(g,x,y,w,h,r){g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h)}
function drawFloor(){
  const g=floor.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); const W=MAP.width*cell,H=MAP.height*cell;
  const bg=g.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#0a1a3c'); bg.addColorStop(1,'#08132e');
  g.fillStyle=bg; g.fillRect(0,0,W,H);
  // grid (every cell faint, every 5 stronger)
  g.lineWidth=1;
  for(let x=0;x<=MAP.width;x++){g.strokeStyle=x%5?'rgba(120,160,255,.045)':'rgba(120,160,255,.11)';g.beginPath();g.moveTo(x*cell,0);g.lineTo(x*cell,H);g.stroke()}
  for(let y=0;y<=MAP.height;y++){g.strokeStyle=y%5?'rgba(120,160,255,.045)':'rgba(120,160,255,.11)';g.beginPath();g.moveTo(0,y*cell);g.lineTo(W,y*cell);g.stroke()}
  // zones
  const names={pallet_area:'PALLET AREA',packing_1:'PACKING 1',packing_2:'PACKING 2',loading_dock:'LOADING DOCK',charging_area:'CHARGING'};
  for(const [k,z] of Object.entries(MAP.zones)){
    g.fillStyle=z.color+'33'; rr(g,z.x*cell,z.y*cell,z.w*cell,z.h*cell,6); g.fill();
    g.setLineDash([5,4]); g.strokeStyle=z.color+'cc'; g.lineWidth=1.2; g.stroke(); g.setLineDash([]);
    g.font=`700 ${Math.max(9,cell*.52)}px Inter,Segoe UI,sans-serif`; g.fillStyle='#c7d8f5'; g.textBaseline='top';
    g.fillText(names[k]||k.toUpperCase(),z.x*cell+7,z.y*cell+6);
  }
  for(const c of (MAP.chargers||[])){g.fillStyle='#2E9FE8';rr(g,c[0]*cell+cell*.15,c[1]*cell+cell*.72,cell*.7,cell*.2,2);g.fill()}
  // shelves as rack bays
  const rows=[...MAP.shelves].sort((a,b)=>a.y-b.y);
  rows.forEach((s,i)=>{
    const x=s.x*cell,y=s.y*cell,w=s.w*cell,h=s.h*cell;
    g.fillStyle='#16295a'; rr(g,x,y,w,h,4); g.fill(); g.strokeStyle='#2a4a93'; g.lineWidth=1; g.stroke();
    g.strokeStyle='rgba(120,170,255,.28)';
    for(let bx=s.x+2;bx<s.x+s.w;bx+=2){g.beginPath();g.moveTo(bx*cell,y+2);g.lineTo(bx*cell,y+h-2);g.stroke()}
    g.fillStyle='rgba(140,190,255,.08)'; g.fillRect(x+2,y+2,w-4,h/2-2);
    g.font=`700 ${Math.max(9,cell*.5)}px Inter,sans-serif`; g.fillStyle='#6f8fc9'; g.textBaseline='middle'; g.textAlign='right';
    g.fillText('A'+(i+1),x-6,y+h/2); g.textAlign='left';
  });
}

/* ---------- robot drawing ---------- */
function drawRobot(r,p){
  const t=MAP.types[r.type],cx=(p.x+.5)*cell,cy=(p.y+.5)*cell,R=Math.max(6,cell*.46);
  ctx.save();
  // soft glow
  const gl=ctx.createRadialGradient(cx,cy,R*.4,cx,cy,R*2.2); gl.addColorStop(0,t.color+'55'); gl.addColorStop(1,t.color+'00');
  ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(cx,cy,R*2.2,0,7); ctx.fill();
  // body
  ctx.fillStyle=t.color; ctx.strokeStyle='#04101f'; ctx.lineWidth=1.5;
  if(t.shape==='circle'){ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();ctx.stroke()}
  else if(t.shape==='square'){rr(ctx,cx-R,cy-R,R*2,R*2,R*.35);ctx.fill();ctx.stroke()}
  else if(t.shape==='triangle'){ctx.beginPath();ctx.moveTo(cx,cy-R*1.1);ctx.lineTo(cx+R*1.05,cy+R*.9);ctx.lineTo(cx-R*1.05,cy+R*.9);ctx.closePath();ctx.fill();ctx.stroke()}
  else{ // drone: body + 4 rotors
    ctx.beginPath();ctx.arc(cx,cy,R*.55,0,7);ctx.fill();ctx.stroke();
    for(const [dx,dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){ctx.beginPath();ctx.arc(cx+dx*R*.95,cy+dy*R*.95,R*.38,0,7);ctx.fillStyle=t.color+'aa';ctx.fill();ctx.stroke()}
  }
  // inner mark
  ctx.fillStyle='rgba(4,16,31,.75)'; ctx.beginPath(); ctx.arc(cx,cy,R*.22,0,7); ctx.fill();
  // battery ring
  ctx.lineWidth=2.2; ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.beginPath(); ctx.arc(cx,cy,R+4,0,7); ctx.stroke();
  ctx.strokeStyle=batColor(r.battery); ctx.beginPath(); ctx.arc(cx,cy,R+4,-Math.PI/2,-Math.PI/2+Math.PI*2*r.battery/100); ctx.stroke();
  if(r.id===sel||r.id===hover){ctx.strokeStyle='#fff';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(cx,cy,R+9,0,7);ctx.stroke()}
  ctx.restore();
}
function drawPath(r,p,color,strong){
  if(!r.path||!r.path.length) return;
  ctx.save(); ctx.strokeStyle=color; ctx.globalAlpha=strong?.9:.28; ctx.lineWidth=strong?2.2:1.2; ctx.setLineDash(strong?[6,5]:[3,5]);
  ctx.beginPath(); ctx.moveTo((p.x+.5)*cell,(p.y+.5)*cell);
  for(const c of r.path) ctx.lineTo((c[0]+.5)*cell,(c[1]+.5)*cell); ctx.stroke(); ctx.setLineDash([]);
  if(r.target){const x=(r.target[0]+.5)*cell,y=(r.target[1]+.5)*cell;ctx.globalAlpha=1;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y-cell*.5);ctx.lineTo(x+cell*.4,y);ctx.lineTo(x,y+cell*.5);ctx.lineTo(x-cell*.4,y);ctx.closePath();ctx.fill()}
  ctx.restore();
}
const KC={box_pick:'#2E9FE8',high_pick:'#f5a524',pallet_move:'#e5484d',inventory_scan:'#46a758'},KL={box_pick:'B',high_pick:'H',pallet_move:'P',inventory_scan:'S'};
function drawTasks(){
  for(const t of SNAP.tasks){
    if(t.status!=='queued') continue;
    const x=(t.pickup[0]+.5)*cell,y=(t.pickup[1]+.5)*cell,R=Math.max(5,cell*.32);
    ctx.fillStyle=KC[t.kind]+'33';ctx.strokeStyle=KC[t.kind];ctx.lineWidth=1.3;rr(ctx,x-R,y-R,R*2,R*2,3);ctx.fill();ctx.stroke();
    ctx.fillStyle=KC[t.kind];ctx.font=`700 ${Math.max(8,cell*.42)}px Inter,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(KL[t.kind],x,y+.5);ctx.textAlign='left';
  }
}
function frame(){
  requestAnimationFrame(frame); if(!MAP) return;
  ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(floor,0,0); ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!SNAP) return;
  for(const r of SNAP.robots){ // ease towards the latest server position
    const d=disp[r.id]||(disp[r.id]={x:r.x,y:r.y}); d.x+=(r.x-d.x)*.35; d.y+=(r.y-d.y)*.35;
  }
  drawTasks();
  for(const r of SNAP.robots) drawPath(r,disp[r.id],MAP.types[r.type].color,r.id===sel);
  // draw flying robots last so they appear above ground traffic
  const order=[...SNAP.robots].sort((a,b)=>MAP.types[a.type].flying-MAP.types[b.type].flying);
  for(const r of order) drawRobot(r,disp[r.id]);
}

/* ---------- side panel + KPIs ---------- */
function fmtDur(x){x=Math.round(x);return x<60?x+'s':Math.floor(x/60)+'m '+String(x%60).padStart(2,'0')+'s'}
function onSnap(){
  const R=SNAP.robots,n=R.length,k=SNAP.kpis,on=R.filter(r=>r.state!=='fault').length;
  $('clock').textContent=fmtT(SNAP.t);
  $('shiftlbl').textContent='Shift '+Math.min(100,Math.round(SNAP.t/SNAP.shift*100))+'%';
  $('livetxt').textContent='Live · '+on+'/'+n;
  $('k_done').innerHTML=`${k.completed}<small>/ ${k.created}</small>`;
  $('k_donesub').textContent=`${k.queued} queued · ${k.active} active`;
  $('k_oph').innerHTML=`${k.orders_per_hour}<small>orders/h</small>`;
  $('k_ophsub').textContent=`B ${k.by_kind.box_pick} · H ${k.by_kind.high_pick} · P ${k.by_kind.pallet_move} · S ${k.by_kind.inventory_scan}`;
  $('k_wait').innerHTML=`${Math.round(k.avg_wait)}<small>s</small>`;
  $('k_waitsub').textContent='avg cycle '+fmtDur(k.avg_cycle);
  $('k_util').innerHTML=`${Math.round(k.utilization)}<small>%</small>`;
  $('k_en').innerHTML=`${k.energy_kwh}<small>kWh</small>`;
  $('k_ensub').textContent=`${k.mismatches} stock mismatches found`;
  document.querySelectorAll('#speed button').forEach(b=>b.classList.toggle('on',+b.dataset.s===SNAP.scale));
  document.querySelectorAll('#alloc button').forEach(b=>b.classList.toggle('on',b.dataset.a===SNAP.allocator));
  $('autoBtn').textContent='Auto orders: '+(SNAP.auto_orders?'ON':'OFF');
  if(tab==='tasks') updateTasks(); else renderPanel();
}
function rowHTML(r){
  const t=MAP.types[r.type];
  return `<div class="rob ${r.id===sel?'sel':''}" data-id="${r.id}">
    <div class="ic" style="background:${t.color}">${GLYPH[r.type]}</div>
    <div><div class="nm">${r.id.replace(/_/g,' ')}</div><div class="meta">${r.action?r.action:t.vendor+' · '+t.interface}</div></div>
    <div class="r"><span class="chip ${r.state}">${r.state}</span><div class="bat"><i style="width:${r.battery}%;background:${batColor(r.battery)}"></i></div></div></div>`;
}
function renderPanel(){
  const P=$('panel'); if(!MAP) return;
  if(tab==='robots'){
    if(!SNAP){P.innerHTML='<div class="empty">Waiting for fleet…</div>';return}
    let h=''; const r=SNAP.robots.find(x=>x.id===sel);
    if(r){const t=MAP.types[r.type];
      h+=`<div class="detail"><h3><span class="ic" style="background:${t.color};width:24px;height:24px;border-radius:7px;display:grid;place-items:center">${GLYPH[r.type]}</span>${r.id.replace(/_/g,' ')}</h3>
      <div style="height:8px"></div>
      <div class="kv"><b>Type</b><span>${t.label}</span></div><div class="kv"><b>Vendor</b><span>${t.vendor}</span></div>
      <div class="kv"><b>Interface</b><span class="mono">${t.interface}</span></div><div class="kv"><b>Speed</b><span>${t.speed} cells/s</span></div>
      <div class="kv"><b>State</b><span class="chip ${r.state}">${r.state}</span></div>
      <div class="kv"><b>Task</b><span>${r.task?'#'+r.task:'—'}</span></div>
      <div class="kv"><b>Action</b><span>${r.action||'—'}</span></div>
      <div class="kv"><b>Position</b><span class="mono">${Math.round(r.x)}, ${Math.round(r.y)}</span></div>
      <div class="kv"><b>Target</b><span class="mono">${r.target?r.target.join(', '):'—'}</span></div>
      <div class="kv"><b>Remaining</b><span>${r.path_len} cells</span></div>
      <div class="kv"><b>Odometer</b><span>${r.dist} cells</span></div>
      <div class="kv"><b>Battery</b><span style="color:${batColor(r.battery)}">${r.battery}%</span></div>
      <div class="bat"><i style="width:${r.battery}%;background:${batColor(r.battery)}"></i></div></div>`}
    for(const [k,t] of Object.entries(MAP.types)){
      const list=SNAP.robots.filter(x=>x.type===k);
      h+=`<div class="grp">${t.label} · ${list.length}</div>`+list.map(rowHTML).join('');
    }
    P.innerHTML=h;
  } else if(tab==='vendors'){
    const by={}; for(const [k,t] of Object.entries(MAP.types)) by[k]=t;
    P.innerHTML=Object.entries(by).map(([k,t])=>{
      const n=SNAP?SNAP.robots.filter(r=>r.type===k).length:0, mv=SNAP?SNAP.robots.filter(r=>r.type===k&&r.state==='moving').length:0;
      return `<div class="vend"><div class="top"><span style="width:10px;height:10px;border-radius:50%;background:${t.color}"></span><b>${t.vendor}</b><span class="on-dot"><i></i>Online</span></div>
      <div class="kv" style="margin-top:8px"><b>Fleet</b><span>${t.label}</span></div>
      <div class="kv"><b>Protocol</b><span class="mono">${t.interface}</span></div>
      <div class="kv"><b>Robots</b><span>${n} (${mv} active)</span></div>
      <div class="kv"><b>Adapter</b><span class="badge">SIMULATED</span></div></div>`}).join('')+
      `<div class="hint" style="color:var(--dim);font-size:11px;padding:2px 4px">Real vendor adapters are added in Phase 3. All four vendors currently run under one TusCore core.</div>`;
  } else { renderTasks(); }
}
const KN={box_pick:'Box pick',high_pick:'High-shelf pick (lift + tote)',pallet_move:'Pallet move',inventory_scan:'Inventory scan'};
function renderTasks(){
  const P=$('panel');
  if(!$('tlist')){
    const rows=MAP.shelves.slice().sort((a,b)=>a.y-b.y).map((s,i)=>`<option value="${i}">A${i+1}</option>`).join('');
    P.innerHTML=`<div class="tsum" id="tsum"></div>
    <form class="oform" id="oform">
      <div class="full"><label>New order</label><select id="o_kind">${MAP.kinds.map(k=>`<option value="${k}">${KN[k]}</option>`).join('')}</select></div>
      <div><label>Shelf row</label><select id="o_row"><option value="">Random</option>${rows}</select></div>
      <div><label>Bay (1-30)</label><input id="o_bay" type="number" min="1" max="30" placeholder="Random"></div>
      <div class="full"><button type="submit">Submit order</button></div>
    </form><div id="tlist"></div>`;
    const sync=()=>{const k=$('o_kind').value;$('o_row').disabled=k==='pallet_move';$('o_bay').disabled=!(k==='box_pick'||k==='high_pick')};
    $('o_kind').onchange=sync; sync();
    $('oform').onsubmit=async e=>{e.preventDefault();
      const row=$('o_row').value,bay=$('o_bay').value;
      await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:$('o_kind').value,row:row===''||$('o_row').disabled?null:+row,bay:bay===''||$('o_bay').disabled?null:+bay-1})});};
  }
  updateTasks();
}
function updateTasks(){
  if(!SNAP||!$('tlist')) return renderTasks();
  const k=SNAP.kpis;
  $('tsum').innerHTML=`<div><b>${k.queued}</b><span>Queued</span></div><div><b>${k.active}</b><span>Active</span></div><div><b>${k.completed}</b><span>Done</span></div>`;
  const label={queued:'Queued',in_progress:'Active',done:'Done'};
  const rows=[...SNAP.tasks.filter(t=>t.status==='in_progress'),...SNAP.tasks.filter(t=>t.status==='queued'),...SNAP.recent.slice(0,8)].slice(0,40);
  $('tlist').innerHTML=rows.map(t=>{
    const who=Object.values(t.robots).map(id=>id.replace(/_/g,' ')).join(' + ');
    const meta=t.status==='queued'?'waiting '+fmtDur(t.wait):t.status==='done'?`done in ${fmtDur(t.cycle)} · ${who}`:who;
    return `<div class="trow"><span class="kd" style="background:${KC[t.kind]}"></span>
      <div style="min-width:0"><div class="nm">#${t.id} ${t.title}${t.manual?' <span class="badge">MANUAL</span>':''}${t.mismatch&&t.status==='done'?' <span class="badge" style="color:var(--warn)">MISMATCH</span>':''}</div><div class="meta">${meta}</div></div>
      <div class="r" style="margin-left:auto;text-align:right"><span class="chip ${t.status}">${label[t.status]}</span><div class="bat"><i style="width:${t.progress*100}%;background:var(--cyan)"></i></div></div></div>`}).join('')||'<div class="empty"><b>No orders yet</b>Orders arrive automatically during the shift, or submit one above.</div>';
}
$('panel').addEventListener('click',e=>{const el=e.target.closest('.rob'); if(el){sel=sel===el.dataset.id?null:el.dataset.id;renderPanel()}});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return; tab=b.dataset.t; document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b)); renderPanel()});
$('speed').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) fetch('/api/sim/speed',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scale:+b.dataset.s})})});
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
$('alloc').addEventListener('click',e=>{const b=e.target.closest('button');if(b)post('/api/sim/allocator',{name:b.dataset.a})});
$('autoBtn').onclick=()=>post('/api/sim/auto-orders',{enabled:!(SNAP&&SNAP.auto_orders)});
$('resetBtn').onclick=()=>post('/api/sim/reset',{});

/* ---------- map interaction ---------- */
const pt=e=>{const r=cv.getBoundingClientRect();return{fx:(e.clientX-r.left)/cell,fy:(e.clientY-r.top)/cell,px:e.clientX-r.left,py:e.clientY-r.top}};
const pick=(fx,fy)=>SNAP&&SNAP.robots.find(r=>{const d=disp[r.id]||r;return Math.hypot(d.x+.5-fx,d.y+.5-fy)<.9});
cv.addEventListener('mousemove',e=>{
  const {fx,fy,px,py}=pt(e),h=pick(fx,fy); hover=h?h.id:null; const tip=$('tip');
  if(h){const t=MAP.types[h.type];tip.style.display='block';tip.style.left=px+24+'px';tip.style.top=py+10+'px';
    tip.innerHTML=`<b>${h.id.replace(/_/g,' ')}</b> · ${h.state}<br><span style="color:var(--muted)">${t.vendor} · battery ${h.battery}%</span>`}
  else tip.style.display='none';
});
cv.addEventListener('mouseleave',()=>{hover=null;$('tip').style.display='none'});
cv.addEventListener('click',async e=>{
  if(!SNAP) return; const {fx,fy}=pt(e),h=pick(fx,fy);
  if(h){sel=h.id;renderPanel();return}
  const x=Math.floor(fx),y=Math.floor(fy); let id=sel;
  if(!id){let best=1e9;for(const r of SNAP.robots){if(r.state!=='idle'||MAP.types[r.type].flying)continue;const d=Math.hypot(r.x-x,r.y-y);if(d<best){best=d;id=r.id}}}
  if(!id) return;
  await fetch(`/api/robots/${id}/goto`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({x,y})});
});
init();
</script>
</body>
</html>
